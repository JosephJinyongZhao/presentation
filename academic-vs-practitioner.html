<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学院派与实战派 · 知识合法性的深层张力</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@400;700&display=swap');
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0f0f14;--bg2:#1a1a24;--card:#22222e;--border:#2a2a3a;--text:#e8e8f0;--text2:#9898b0;--accent:#7c6ff0;--accent2:#5b8def;--accent3:#f0a06c;--green:#6bcb9a;--red:#e86a6a;--gold:#f0d06c;--radius:16px}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text)}
  .presentation{width:100vw;height:100vh;position:relative;overflow:hidden}
  .slides-container{width:100%;height:100%;position:relative}
  .slide{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:6vh 8vw;opacity:0;pointer-events:none;transition:opacity .6s ease;overflow-y:auto}
  .slide.active{opacity:1;pointer-events:auto;z-index:10}
  .nav-bar{position:fixed;bottom:3vh;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;z-index:100;background:rgba(15,15,20,.85);backdrop-filter:blur(12px);padding:10px 24px;border-radius:40px;border:1px solid var(--border)}
  .nav-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
  .nav-btn:hover{background:var(--accent);border-color:var(--accent)}
  .nav-dots{display:flex;gap:6px}
  .nav-dot{width:8px;height:8px;border-radius:50%;background:var(--text2);cursor:pointer;transition:all .3s;border:none}
  .nav-dot.active{background:var(--accent);width:24px;border-radius:4px}
  .slide-counter{font-size:13px;color:var(--text2);min-width:50px;text-align:center}
  .slide-title{font-size:clamp(2.4rem,5vw,4.2rem);font-weight:900;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:1.2rem;text-align:center;line-height:1.3}
  .slide-subtitle{font-size:clamp(1rem,2vw,1.4rem);color:var(--text2);text-align:center;max-width:80%;line-height:1.6;font-weight:300}
  .slide-label{font-size:clamp(.7rem,1.2vw,.9rem);color:var(--accent3);text-transform:uppercase;letter-spacing:3px;margin-bottom:.8rem;font-weight:500}
  .slide-body{width:100%;max-width:1100px}
  .slide-body h2{font-size:clamp(1.6rem,3vw,2.6rem);font-weight:700;margin-bottom:1rem;color:var(--text)}
  .slide-body h3{font-size:clamp(1.1rem,1.8vw,1.5rem);font-weight:500;margin-bottom:.6rem;color:var(--accent2)}
  .slide-body p{font-size:clamp(.95rem,1.6vw,1.25rem);line-height:1.7;color:var(--text2);margin-bottom:.8rem}
  .slide-body ul,.slide-body ol{list-style:none;padding:0}
  .slide-body li{font-size:clamp(.95rem,1.5vw,1.2rem);line-height:1.6;color:var(--text2);padding:.5rem 0 .5rem 1.8rem;position:relative}
  .slide-body li::before{content:'';position:absolute;left:0;top:.85rem;width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .highlight-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem 2rem;margin:1rem 0;border-left:4px solid var(--accent)}
  .highlight-box.gold{border-left-color:var(--gold)}.highlight-box.green{border-left-color:var(--green)}.highlight-box.red{border-left-color:var(--red)}
  .highlight-box p{margin-bottom:.4rem}.highlight-box p:last-child{margin-bottom:0}
  .quote{font-family:'Noto Serif SC',serif;font-size:clamp(1.1rem,2vw,1.6rem);font-style:italic;color:var(--gold);text-align:center;padding:1.5rem 2rem;border-left:3px solid var(--gold);margin:1rem 0;line-height:1.6}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin:1rem 0}
  .grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.2rem;margin:1rem 0}
  .card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;transition:all .3s}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card h4{font-size:clamp(.9rem,1.3vw,1.1rem);font-weight:700;margin-bottom:.5rem}
  .card p{font-size:clamp(.8rem,1.1vw,.95rem);margin-bottom:0}.card .icon{font-size:2rem;margin-bottom:.5rem;display:block}
  .flow-row{display:flex;align-items:center;justify-content:center;gap:.5rem;flex-wrap:wrap;margin:1rem 0}
  .flow-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:.8rem 1.2rem;text-align:center;font-size:clamp(.8rem,1.2vw,1rem);min-width:100px}
  .flow-item.accent{border-color:var(--accent);background:rgba(124,111,240,.1)}
  .flow-item.gold{border-color:var(--gold);background:rgba(240,208,108,.1)}
  .flow-item.green{border-color:var(--green);background:rgba(107,203,154,.1)}
  .flow-item.red{border-color:var(--red);background:rgba(232,106,106,.1)}
  .flow-arrow{font-size:1.5rem;color:var(--text2)}
  .comp-table{width:100%;border-collapse:collapse;margin:1rem 0;font-size:clamp(.85rem,1.2vw,1rem)}
  .comp-table th{background:var(--card);padding:.8rem 1rem;text-align:left;font-weight:600;border-bottom:2px solid var(--accent)}
  .comp-table td{padding:.7rem 1rem;border-bottom:1px solid var(--border);color:var(--text2)}
  .comp-table tr:hover td{background:rgba(124,111,240,.05)}
  .tag{display:inline-block;padding:2px 10px;border-radius:20px;font-size:.8rem;font-weight:500}
  .tag.green{background:rgba(107,203,154,.15);color:var(--green)}
  .tag.red{background:rgba(232,106,106,.15);color:var(--red)}
  .knowledge-flow{display:flex;flex-direction:column;align-items:center;gap:.6rem;margin:1.5rem 0}
  .knowledge-row{display:flex;align-items:center;gap:1rem;justify-content:center;flex-wrap:wrap}
  .k-node{background:var(--card);border:2px solid var(--border);border-radius:14px;padding:1rem 1.5rem;text-align:center;min-width:140px;transition:all .3s}
  .k-node:hover{transform:scale(1.05)}.k-node h4{font-size:1rem;margin-bottom:.3rem}.k-node p{font-size:.8rem;color:var(--text2);margin:0}
  .k-node.k1{border-color:var(--accent)}.k-node.k2{border-color:var(--accent2)}.k-node.k3{border-color:var(--gold)}.k-node.k4{border-color:var(--green)}
  .k-arrow{color:var(--text2);font-size:1.2rem}
  .title-slide{text-align:center}
  .title-slide .slide-title{font-size:clamp(2.8rem,6vw,5rem);margin-bottom:1.5rem}
  .title-slide .meta{color:var(--text2);font-size:clamp(.9rem,1.4vw,1.1rem);margin-top:2rem}
  @media(max-width:768px){.slide{padding:4vh 5vw}.grid-2,.grid-3{grid-template-columns:1fr}.nav-bar{gap:8px;padding:8px 16px}}
  .slide::-webkit-scrollbar{width:4px}.slide::-webkit-scrollbar-track{background:transparent}.slide::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
  .fade-up{opacity:0;transform:translateY(20px);transition:all .6s ease}
  .slide.active .fade-up{opacity:1;transform:translateY(0)}
  .slide.active .fade-up:nth-child(2){transition-delay:.1s}.slide.active .fade-up:nth-child(3){transition-delay:.2s}
  .slide.active .fade-up:nth-child(4){transition-delay:.3s}.slide.active .fade-up:nth-child(5){transition-delay:.4s}
  .slide.active .fade-up:nth-child(6){transition-delay:.5s}.slide.active .fade-up:nth-child(7){transition-delay:.6s}
  .slide.active .fade-up:nth-child(8){transition-delay:.7s}.slide.active .fade-up:nth-child(9){transition-delay:.8s}
</style>
</head>

<script>
var slidesData = [{"content": "<div class=\"slide-body title-slide\"><div class=\"slide-label fade-up\">一个饭桌上的哲学追问</div><div class=\"slide-title fade-up\">学院派与实战派</div><div class=\"slide-subtitle fade-up\" style=\"font-size:clamp(1.2rem,2.2vw,1.8rem);margin-bottom:1rem;\">知识合法性的深层张力</div><div class=\"slide-subtitle fade-up\" style=\"font-size:clamp(.9rem,1.3vw,1.1rem);max-width:70%;\">当&ldquo;你做过企业吗？&rdquo;成为一个真问题</div><div class=\"meta fade-up\" style=\"margin-top:3rem;\"><div style=\"display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;\"><span style=\"background:var(--card);padding:.5rem 1.2rem;border-radius:20px;border:1px solid var(--border);\">🧠 认识论追问</span><span style=\"background:var(--card);padding:.5rem 1.2rem;border-radius:20px;border:1px solid var(--border);\">⚖️ 合法性追问</span><span style=\"background:var(--card);padding:.5rem 1.2rem;border-radius:20px;border:1px solid var(--border);\">💡 价值追问</span></div></div><div style=\"margin-top:2rem;color:var(--text2);font-size:clamp(.8rem,1.1vw,.95rem);\">源于2026年6月24日与黄姗姗父亲（创一代企业家）饭桌对话</div></div>"}, {"content": "<div class=\"slide-body\"><div class=\"slide-label fade-up\">01 / 问题的本质</div><h2 class=\"fade-up\">这不是一个质疑，是一个哲学追问</h2><p class=\"fade-up\" style=\"margin-bottom:1.5rem;\">黄姗姗的父亲——一位经历多个周期的创一代企业家——在饭桌上温和地问出&ldquo;你自己做过企业吗？&rdquo;时，他问的不是你的简历，而是三个更深的追问：</p><div class=\"grid-3 fade-up\"><div class=\"card\" style=\"border-left:4px solid var(--accent);\"><span class=\"icon\">🧠</span><h4>认识论追问</h4><p>没有亲身经历的人，能否获得关于这件事的真知？</p></div><div class=\"card\" style=\"border-left:4px solid var(--gold);\"><span class=\"icon\">⚖️</span><h4>合法性追问</h4><p>没有实践检验的知识，凭什么指导实践者？</p></div><div class=\"card\" style=\"border-left:4px solid var(--green);\"><span class=\"icon\">💡</span><h4>价值追问</h4><p>你说的话，对我到底有没有用？</p></div></div><div class=\"highlight-box fade-up\"><p style=\"font-weight:500;\">这三个追问，指向一个古老的哲学分歧——<strong style=\"color:var(--gold);\">&ldquo;知&rdquo;与&ldquo;行&rdquo;的关系</strong>。</p><p>从王阳明的&ldquo;知行合一&rdquo;到杜威的&ldquo;做中学&rdquo;，从波兰尼的&ldquo;默会知识&rdquo;到塞利斯的&ldquo;实践智慧&rdquo;，这个问题被讨论了上千年，没有终极答案，但每一次被问出，都值得认真对待。</p></div></div>"}, {"content": "<div class=\"slide-body\"><div class=\"slide-label fade-up\">02 / 合理部分</div><h2 class=\"fade-up\">为什么老爷子的敲打值得认真对待</h2><div class=\"grid-3 fade-up\" style=\"margin-top:1rem;\"><div class=\"card\" style=\"border-left:4px solid var(--red);\"><span class=\"icon\">🤫</span><h4>默会知识的不可传递性</h4><p>&ldquo;我们知道的，比我们能说出来的多。&rdquo;——波兰尼</p><div style=\"margin-top:.8rem;font-size:.85rem;color:var(--text2);\"><div>• 骑自行车的感觉无法用语言描述</div><div>• 判断合作伙伴的直觉无法逻辑推导</div><div>• &ldquo;分寸感&rdquo;无法从书本学到</div></div></div><div class=\"card\" style=\"border-left:4px solid var(--red);\"><span class=\"icon\">🎯</span><h4>决策情境的不可还原性</h4><p>商业决策不是在真空中做出的。</p><div style=\"margin-top:.8rem;font-size:.85rem;color:var(--text2);\"><div>• ⏱ 时间压力：信息不全时必须决定</div><div>• 👥 利益冲突：影响几百人的饭碗</div><div>• 💔 情绪负荷：失败时睡不着觉</div></div></div><div class=\"card\" style=\"border-left:4px solid var(--red);\"><span class=\"icon\">🔄</span><h4>逻辑的自我验证陷阱</h4><p>逻辑可以自圆其说，但可能和现实无关。</p><div style=\"margin-top:.8rem;font-size:.85rem;color:var(--text2);\"><div>• 漂亮的模型可能因一个变量崩溃</div><div>• 逻辑帮你解释世界，但不保证解释对了</div><div>• 未经检验的逻辑 = 精致的假设</div></div></div></div><div class=\"highlight-box red fade-up\"><p><strong>合理内核</strong>：有些知识确实只能通过亲身实践获得。学院派的知识体系里，存在一个无法被逻辑覆盖的<strong style=\"color:var(--gold);\">&ldquo;体感盲区&rdquo;</strong>。</p></div></div>"}, {"content": "<div class=\"slide-body\"><div class=\"slide-label fade-up\">03 / 反驳</div><h2 class=\"fade-up\">为什么这个敲打并不完整</h2><h3 class=\"fade-up\" style=\"margin-top:.5rem;\">🧠 认识论层面：观察者知识是另一种真知</h3><div class=\"grid-2 fade-up\"><div><div class=\"highlight-box green\" style=\"height:100%;\"><p><strong>不需要亲历所有事才能理解它</strong></p><p style=\"font-size:.9rem;\">历史学家没经历过唐朝，但可以比唐朝人更深刻地理解唐朝兴衰的原因。经济学家没经营过企业，但可以通过数据和模型揭示企业行为的宏观规律。</p><p style=\"font-size:.9rem;margin-top:.5rem;\"><strong style=\"color:var(--gold);\">理解一件事，不等于重复一件事。</strong></p></div></div><div><div class=\"highlight-box green\" style=\"height:100%;\"><p><strong>旁观者视角有独特的优势</strong></p><p style=\"font-size:.9rem;\">亲历者容易被&ldquo;当局者迷&rdquo;——身处其中时看不到全局。观察者可以看到跨行业、跨周期的模式。</p><p style=\"font-size:.9rem;margin-top:.5rem;\">亲历者的知识是<strong>&ldquo;点状&rdquo;</strong>的，观察者的知识可以是<strong>&ldquo;网状&rdquo;</strong>的。</p></div></div></div><div class=\"fade-up\" style=\"margin-top:.5rem;\"><div class=\"flow-row\"><div class=\"flow-item green\"><strong>实践</strong><br><span style=\"font-size:.8rem;\">→ 体感知识</span></div><span class=\"flow-arrow\">⇄</span><div class=\"flow-item accent\"><strong>观察</strong><br><span style=\"font-size:.8rem;\">→ 模式知识</span></div><span class=\"flow-arrow\">≠</span><div class=\"flow-item gold\"><strong>不同的知识类型</strong><br><span style=\"font-size:.8rem;\">不是高低之分</span></div></div></div><div class=\"highlight-box fade-up\"><p><strong>类比</strong>：最好的足球教练不一定是前球星——穆里尼奥没踢过顶级联赛，但他是顶级教练。最好的赛车工程师不一定是赛车手——纽维没开过F1，但他设计的赛车赢了无数冠军。</p></div></div>"}, {"content": "<div class=\"slide-body\"><div class=\"slide-label fade-up\">03 / 反驳（续）</div><h2 class=\"fade-up\">三重反驳：逻辑 · 历史 · 结果</h2><div class=\"grid-3 fade-up\" style=\"margin-top:1rem;\"><div class=\"card\" style=\"border-left:4px solid var(--accent2);\"><span class=\"icon\">🔗</span><h4>逻辑本身就是一种实践</h4><p style=\"font-size:.85rem;\">构建逻辑框架、分析因果关系——这些本身就是高强度的智力实践。</p><p style=\"font-size:.85rem;margin-top:.5rem;color:var(--gold);\">没有逻辑的经验是散乱的，没有经验的逻辑是空洞的。</p></div><div class=\"card\" style=\"border-left:4px solid var(--accent2);\"><span class=\"icon\">📜</span><h4>学院派与实战派的分合史</h4><p style=\"font-size:.85rem;\">现代商业本身就是学院派的产物。MBA教育培养了现代企业的大部分高管。</p><p style=\"font-size:.85rem;margin-top:.5rem;color:var(--gold);\">最优秀的实战者往往也是最认真的理论学习者。</p></div><div class=\"card\" style=\"border-left:4px solid var(--accent2);\"><span class=\"icon\">📊</span><h4>学院派的价值已被反复证明</h4><p style=\"font-size:.85rem;\">波特五力、颠覆式创新、蓝海战略——被全球企业家使用。</p><p style=\"font-size:.85rem;margin-top:.5rem;color:var(--gold);\">教练不一定比运动员跑得快，但他知道怎么让运动员跑得更快。</p></div></div><div class=\"highlight-box fade-up\" style=\"margin-top:.5rem;\"><p><strong>一个有趣的反问</strong>：如果&ldquo;没做过就不能指导&rdquo;成立，那老爷子自己是否也只能指导自己做过的事？他做电信级硬件，能否指导餐饮行业？</p><p style=\"margin-top:.3rem;\">他能给出&ldquo;不能太大不能太小&rdquo;这样的普适性洞见，恰恰说明<strong style=\"color:var(--gold);\">经验可以提炼为超越具体领域的智慧</strong>。而这个提炼过程，就是学院派擅长的——从具体中抽象出一般。</p></div></div>"}, {"content": "<div class=\"slide-body\"><div class=\"slide-label fade-up\">04 / 综合框架</div><h2 class=\"fade-up\">知识的四种类型</h2><div class=\"knowledge-flow fade-up\"><div class=\"knowledge-row\"><div class=\"k-node k1\"><h4>🖐️ 体感知识</h4><p>亲身实践</p><p style=\"font-size:.75rem;color:var(--green);\">有温度、有分寸</p><p style=\"font-size:.75rem;color:var(--red);\">样本小、难传递</p></div><div class=\"k-arrow\">→</div><div class=\"k-node k2\"><h4>👁️ 模式知识</h4><p>观察分析</p><p style=\"font-size:.75rem;color:var(--green);\">可迁移、可验证</p><p style=\"font-size:.75rem;color:var(--red);\">缺乏体感</p></div><div class=\"k-arrow\">→</div><div class=\"k-node k3\"><h4>📐 框架知识</h4><p>理论学习</p><p style=\"font-size:.75rem;color:var(--green);\">系统化、结构化</p><p style=\"font-size:.75rem;color:var(--red);\">可能自洽但空洞</p></div><div class=\"k-arrow\">→</div><div class=\"k-node k4\"><h4>🌟 智慧</h4><p>三者融合</p><p style=\"font-size:.75rem;color:var(--green);\">判断力+解释力</p><p style=\"font-size:.75rem;color:var(--gold);\">需要时间沉淀</p></div></div></div><div class=\"grid-2 fade-up\" style=\"margin-top:.5rem;\"><div class=\"highlight-box red\"><p><strong>老爷子的敲打提醒你</strong></p><p style=\"font-size:.9rem;\">你的知识可能偏重&ldquo;模式知识&rdquo;和&ldquo;框架知识&rdquo;，缺乏&ldquo;体感知识&rdquo;。</p></div><div class=\"highlight-box green\"><p><strong>你的反驳提醒老爷子</strong></p><p style=\"font-size:.9rem;\">他的知识可能偏重&ldquo;体感知识&rdquo;，缺乏&ldquo;模式知识&rdquo;的系统性。</p></div></div></div>"}, {"content": "<div class=\"slide-body\"><div class=\"slide-label fade-up\">04 / 综合框架</div><h2 class=\"fade-up\">什么时候谁更有发言权</h2><div class=\"fade-up\" style=\"overflow-x:auto;margin-top:.5rem;\"><table class=\"comp-table\"><thead><tr><th>场景</th><th>学院派优势</th><th>实战派优势</th></tr></thead><tbody><tr><td>分析宏观趋势</td><td><span class=\"tag green\">✅ 跨周期比较</span></td><td><span class=\"tag red\">❌ 样本有限</span></td></tr><tr><td>判断具体决策</td><td><span class=\"tag red\">❌ 缺乏情境体感</span></td><td><span class=\"tag green\">✅ 有体感、有分寸</span></td></tr><tr><td>构建分析框架</td><td><span class=\"tag green\">✅ 逻辑严密、可复用</span></td><td><span class=\"tag red\">❌ 可能过于具体</span></td></tr><tr><td>应对突发危机</td><td><span class=\"tag red\">❌ 缺乏压力测试</span></td><td><span class=\"tag green\">✅ 经历过、有直觉</span></td></tr><tr><td>识别行业模式</td><td><span class=\"tag green\">✅ 跨案例比较</span></td><td><span class=\"tag red\">❌ 被自身经验局限</span></td></tr><tr><td>执行落地细节</td><td><span class=\"tag red\">❌ 缺乏操作经验</span></td><td><span class=\"tag green\">✅ 知道坑在哪</span></td></tr></tbody></table></div><div class=\"highlight-box gold fade-up\"><p style=\"text-align:center;font-size:clamp(1rem,1.5vw,1.2rem);\"><strong>不是谁比谁强，而是不同场景需要不同的知识类型。</strong><br>好的判断力来自知道<strong style=\"color:var(--gold);\">什么时候用哪种知识</strong>。</p></div></div>"}, {"content": "<div class=\"slide-body\"><div class=\"slide-label fade-up\">04 / 综合框架</div><h2 class=\"fade-up\">从&ldquo;逻辑&rdquo;到&ldquo;智慧&rdquo;的路径</h2><div class=\"fade-up\" style=\"margin:1.5rem 0;\"><div class=\"flow-row\" style=\"gap:.3rem;\"><div class=\"flow-item accent\">📐 逻辑</div><span class=\"flow-arrow\">→</span><div class=\"flow-item\">🧪 被实践检验</div><span class=\"flow-arrow\">→</span><div class=\"flow-item red\">🔧 被失败修正</div><span class=\"flow-arrow\">→</span><div class=\"flow-item gold\">⏳ 被时间沉淀</div><span class=\"flow-arrow\">→</span><div class=\"flow-item green\">🌟 智慧</div></div></div><div class=\"grid-2 fade-up\" style=\"margin-top:.5rem;\"><div class=\"card\"><h4 style=\"color:var(--accent);\">加速转化的方式</h4><ul style=\"list-style:none;padding:0;\"><li style=\"padding:.3rem 0;font-size:.9rem;color:var(--text2);\">🔍 <strong>深度观察</strong>：参与式观察 = 低成本实践</li><li style=\"padding:.3rem 0;font-size:.9rem;color:var(--text2);\">📁 <strong>案例积累</strong>：每分析一个案例 = 模拟经营一次</li><li style=\"padding:.3rem 0;font-size:.9rem;color:var(--text2);\">🔬 <strong>假设检验</strong>：让企业家用实际经验验证你的框架</li><li style=\"padding:.3rem 0;font-size:.9rem;color:var(--text2);\">📉 <strong>失败学习</strong>：失败案例揭示理论的边界</li></ul></div><div class=\"card\"><h4 style=\"color:var(--gold);\">你已经在路上</h4><ul style=\"list-style:none;padding:0;\"><li style=\"padding:.3rem 0;font-size:.9rem;color:var(--text2);\">✅ 构建了价值三角框架（逻辑）</li><li style=\"padding:.3rem 0;font-size:.9rem;color:var(--text2);\">✅ 用框架分析实际案例（检验）</li><li style=\"padding:.3rem 0;font-size:.9rem;color:var(--text2);\">✅ 在交流中应用框架（实践）</li><li style=\"padding:.3rem 0;font-size:.9rem;color:var(--text2);\">✅ 被敲打后反思框架局限（修正）</li></ul></div></div><div class=\"highlight-box gold fade-up\"><p style=\"text-align:center;\">你不是&ldquo;有逻辑但缺乏智慧&rdquo;，你是在<strong style=\"color:var(--gold);\">&ldquo;用逻辑走向智慧&rdquo;</strong>的路上。</p></div></div>"}, {"content": "<div class=\"slide-body\"><div class=\"slide-label fade-up\">05 / 对你个人的启示</div><h2 class=\"fade-up\">你的独特位置</h2><div class=\"grid-2 fade-up\" style=\"margin-top:1rem;\"><div class=\"card\" style=\"border-left:4px solid var(--accent);\"><span class=\"icon\">🎓</span><h4>学院派的底子</h4><p>北大光华博士，受过系统的学术训练</p></div><div class=\"card\" style=\"border-left:4px solid var(--green);\"><span class=\"icon\">🚪</span><h4>实战派的窗口</h4><p>分院运营总监，每天都在和企业打交道</p></div><div class=\"card\" style=\"border-left:4px solid var(--gold);\"><span class=\"icon\">🏗️</span><h4>框架构建能力</h4><p>一天内产出价值三角、价值传递等多个框架</p></div><div class=\"card\" style=\"border-left:4px solid var(--accent2);\"><span class=\"icon\">🪞</span><h4>反思习惯</h4><p>被敲打后不是防御，而是认真思考</p></div></div><div class=\"highlight-box fade-up\"><p style=\"text-align:center;font-size:clamp(1rem,1.5vw,1.2rem);\">这个组合本身就是一个<strong style=\"color:var(--gold);\">&ldquo;互补资产&rdquo;</strong>——大多数学院派没有你的实战接触面，大多数实战派没有你的框架能力。</p></div></div>"}, {"content": "<div class=\"slide-body\"><div class=\"slide-label fade-up\">05 / 对你个人的启示</div><h2 class=\"fade-up\">老爷子的敲打真正提醒你的是什么</h2><div class=\"grid-2 fade-up\" style=\"margin-top:1rem;\"><div class=\"card\" style=\"border-left:4px solid var(--gold);\"><span class=\"icon\">🙏</span><h4>保持谦逊</h4><p>知道你的框架有边界，知道体感知识的存在</p></div><div class=\"card\" style=\"border-left:4px solid var(--green);\"><span class=\"icon\">🔍</span><h4>补充体感</h4><p>通过深度观察和参与来弥补&ldquo;没做过&rdquo;的空白</p></div><div class=\"card\" style=\"border-left:4px solid var(--accent);\"><span class=\"icon\">🎯</span><h4>明确角色</h4><p>你的价值不是&ldquo;告诉企业家怎么做&rdquo;，而是&ldquo;给企业家提供更好的思考工具&rdquo;</p></div><div class=\"card\" style=\"border-left:4px solid var(--red);\"><span class=\"icon\">🧪</span><h4>检验框架</h4><p>每次和企业家的交流都是一次框架检验——哪些预测对了，哪些错了</p></div></div></div>"}, {"content": "<div class=\"slide-body\"><div class=\"slide-label fade-up\">06 / 可用的回应框架</div><h2 class=\"fade-up\">下次再被问到&ldquo;你做过企业吗？&rdquo;</h2><div class=\"quote fade-up\" style=\"margin:2rem 0;font-size:clamp(1.2rem,2.2vw,1.8rem);\">&ldquo;我没做过，所以我不告诉你&lsquo;该怎么做&rsquo;。但我研究过上百个和你类似的企业，所以我可以告诉你&lsquo;别人是怎么做的&rsquo;、&lsquo;哪些做法成功了、哪些失败了&rsquo;、&lsquo;有什么框架可以帮助你思考&rsquo;。决定还是你做，我只是给你多一个视角。&rdquo;</div><div class=\"grid-2 fade-up\" style=\"margin-top:1rem;\"><div class=\"highlight-box red\"><p><strong>承认局限</strong></p><p style=\"font-size:.9rem;\">&ldquo;我没做过&rdquo;——坦诚体感知识的空白，不假装自己懂</p></div><div class=\"highlight-box green\"><p><strong>守住价值</strong></p><p style=\"font-size:.9rem;\">&ldquo;多一个视角&rdquo;——明确你的角色是提供工具，而非替代判断</p></div></div></div>"}, {"content": "<div class=\"slide-body title-slide\"><div class=\"slide-label fade-up\">总结</div><div class=\"slide-title fade-up\" style=\"font-size:clamp(2rem,4vw,3.2rem);\">核心结论</div><div class=\"fade-up\" style=\"margin:2rem auto;max-width:800px;text-align:left;\"><div class=\"highlight-box\" style=\"margin:.8rem 0;\"><p>1️⃣ <strong>老爷子的敲打有合理内核</strong>——体感知识确实存在，且无法通过逻辑完全替代</p></div><div class=\"highlight-box green\" style=\"margin:.8rem 0;\"><p>2️⃣ <strong>但反驳也同样坚实</strong>——观察者知识是另一种真知，逻辑本身就是一种实践</p></div><div class=\"highlight-box gold\" style=\"margin:.8rem 0;\"><p>3️⃣ <strong>两者不是对立关系</strong>——最优秀的实践者往往也是最认真的理论学习者</p></div><div class=\"highlight-box\" style=\"margin:.8rem 0;border-left-color:var(--accent2);\"><p>4️⃣ <strong>你的独特位置</strong>——学院派底子+实战派窗口+框架能力+反思习惯，这个组合本身就是稀缺的</p></div><div class=\"highlight-box green\" style=\"margin:.8rem 0;\"><p>5️⃣ <strong>从逻辑到智慧没有捷径</strong>——但你已经在正确的路上</p></div></div><div class=\"quote fade-up\" style=\"margin:2rem auto;max-width:700px;\">&ldquo;没有。但我在学习那些做过企业的人的经验，试图理解他们成功和失败的原因，然后把这种理解变成可用的框架。我不告诉你&lsquo;该怎么做&rsquo;，我告诉你&lsquo;别人是怎么做的、为什么这么做、还有什么可能&rsquo;。决定是你做的，我只是帮你多一个视角。&rdquo;</div><div style=\"margin-top:2rem;color:var(--text2);font-size:clamp(.8rem,1.1vw,.95rem);\">这个回答，既尊重了老爷子的敲打，也守住了自己的价值。</div></div>"}];

var currentSlide = 0;
var container = document.getElementById('slidesContainer');
var dotsContainer = document.getElementById('navDots');
var counter = document.getElementById('slideCounter');

function renderSlide(index) {
  container.innerHTML = '';
  for (var i = 0; i < slidesData.length; i++) {
    var div = document.createElement('div');
    div.className = 'slide' + (i === index ? ' active' : '');
    div.innerHTML = slidesData[i].content;
    container.appendChild(div);
  }
  var dotsHtml = '';
  for (var i = 0; i < slidesData.length; i++) {
    dotsHtml += '<button class="nav-dot' + (i === index ? ' active' : '') + '" onclick="goTo(' + i + ')"></button>';
  }
  dotsContainer.innerHTML = dotsHtml;
  counter.textContent = (index + 1) + ' / ' + slidesData.length;
}

function goTo(n) {
  if (n < 0) n = 0;
  if (n >= slidesData.length) n = slidesData.length - 1;
  currentSlide = n;
  renderSlide(currentSlide);
}

function nextSlide() { goTo(currentSlide + 1); }
function prevSlide() { goTo(currentSlide - 1); }

document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); nextSlide(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); prevSlide(); }
});

renderSlide(0);
</script>
</body>
</html>
